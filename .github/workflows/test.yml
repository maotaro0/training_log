name: Rails checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: training_log_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development
      BASIC_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare SQLite and run tests
        run: bundle exec rails db:prepare test
      - name: Browser tests
        run: bundle exec rails test:system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-schema
          path: db/schema.rb
      - name: Test PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/training_log_test
        run: bundle exec rails db:prepare test
      - name: Compile production assets
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bundle exec rails assets:precompile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
